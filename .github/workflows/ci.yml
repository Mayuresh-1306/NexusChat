name: NexusChat CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: TypeScript Lint & Type Check
      run: npm run lint

    - name: Build Frontend (Vite)
      run: npm run build

    - name: Verify Dockerfile Build
      run: docker build -t nexus-chat:ci .

